name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    # Superseded runs are cancelled, except on main so a deployment always finishes
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    commits:
        name: Commit subjects
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Conventional Commits
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
                  TITLE: ${{ github.event.pull_request.title }}
              run: |
                  # type(scope)!: summary, as in CONTRIBUTING.md. A pull request's title too,
                  # since squash-merging makes it the commit subject on main.
                  pattern='(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9-]+\))?!?: [^ ]'
                  if git cat-file -e "$BASE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BASE" "$HEAD"; then
                      range="$BASE..$HEAD"
                  else
                      range="$HEAD~1..$HEAD" # a new branch or a rewritten history: check the tip
                  fi
                  bad=$(git log --no-merges --format='%h %s' "$range" | grep -vE "^[0-9a-f]+ $pattern" || true)
                  if [ -n "$TITLE" ] && ! printf '%s' "$TITLE" | grep -qE "^$pattern"; then
                      bad="${bad}${bad:+$'\n'}pull request title: $TITLE"
                  fi
                  if [ -n "$bad" ]; then
                      echo "::error::Subjects must look like 'fix(rsvp): what changed'. See CONTRIBUTING.md."
                      echo "$bad"
                      exit 1
                  fi
                  echo "commit subjects ok ($range)"

    check:
        name: Lint, test and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: ESLint
              run: npm run lint:js

            - name: Stylelint
              run: npm run lint:css

            - name: Prettier
              run: npm run format:check

            - name: Tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Browsers for the end-to-end tests
              run: npx playwright install --with-deps chromium webkit

            - name: End-to-end tests
              run: npm run test:e2e

            - name: Keep the end-to-end traces of a failed run
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-results
                  path: test-results
                  retention-days: 7

            - name: Upload site for GitHub Pages
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        name: Deploy to GitHub Pages
        needs: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
