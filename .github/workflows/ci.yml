name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    # Superseded runs are cancelled, except on main so a deployment always finishes
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    check:
        name: Lint and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: ESLint
              run: npm run lint:js

            - name: Stylelint
              run: npm run lint:css

            - name: Prettier
              run: npm run format:check

            - name: Tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Upload site for GitHub Pages
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        name: Deploy to GitHub Pages
        needs: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
