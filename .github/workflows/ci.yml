name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: ESLint
              run: npm run lint:js

            - name: Stylelint
              run: npm run lint:css

            - name: Prettier
              run: npm run format:check

            - name: Build
              run: npm run build
